<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Заставка группы — Ветра</title>
<meta name="description" content="Картинка для аватара группы Ветры: 1024 × 1024, PNG.">
<meta property="og:title" content="Заставка группы — Ветра">
<meta property="og:description" content="Картинка для аватара группы: 1024 × 1024, PNG. Открой и скачай.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:image" content="https://errorslove190-droid.github.io/sites/vetra/zastavka/avatar-vetra-1024.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{
  --page:#F7FAFE;--card:#FFFFFF;--ink:#0F1D2E;--muted:#56687F;--faint:#8494A8;
  --line:#DCE6F2;--blue:#2C78D5;--blue-press:#1F63BC;--blue-tint:#EFF5FD;--navy:#0E2A4A;
  --r:10px;--r-lg:18px;--r-pill:999px;
  --text:"Google Sans Text","Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--page:#0A1F38;--card:#0E2A4A;--ink:#EAF1FA;--muted:#AEBDD1;--faint:#8494A8;
    --line:#274261;--blue:#81AEE6;--blue-press:#A9C8F0;--blue-tint:#122F52;--navy:#EAF1FA;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh;display:flex;flex-direction:column;
  background:var(--page);color:var(--ink);font-family:var(--text);
  -webkit-font-smoothing:antialiased;line-height:1.45;
}
header{
  display:flex;align-items:center;gap:10px;padding:16px 20px;
  border-bottom:1px solid var(--line);
}
header img{width:28px;height:28px;border-radius:8px;display:block}
header b{font-weight:600;letter-spacing:.01em}
header span{color:var(--muted);font-size:14px}
main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 16px 48px;text-align:center;
}
h1{font-size:clamp(22px,4vw,30px);font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
.sub{margin:0 0 24px;color:var(--muted);font-size:15px}
figure{
  margin:0 0 28px;padding:16px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 10px 30px rgba(14,42,74,.08);
}
figure img{
  display:block;width:min(420px,78vw);height:auto;aspect-ratio:1/1;
  border-radius:var(--r);
}
figcaption{margin-top:12px;color:var(--faint);font-size:13px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:56px;padding:0 32px;border-radius:var(--r-pill);
  background:var(--blue);color:#fff;text-decoration:none;
  font-size:20px;font-weight:600;letter-spacing:.005em;
  transition:background .15s ease,transform .1s ease;
}
.btn:hover{background:var(--blue-press)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--blue-tint);outline-offset:2px}
.btn svg{width:22px;height:22px;flex:none}
@media (prefers-color-scheme: dark){ .btn{color:#0A1F38} }
.hint{margin:16px 0 0;color:var(--muted);font-size:14px;max-width:34ch}
.hint a{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
@media (max-width:420px){
  .btn{width:100%;font-size:18px}
  main{padding:24px 14px 40px}
}
</style>
</head>
<body>
<header>
  <img src="../favicon.svg" alt="">
  <b>Ветра</b>
  <span>· заставка группы</span>
</header>

<main>
  <h1>Заставка группы</h1>
  <p class="sub">Знак Ветры для аватара группы</p>

  <figure>
    <img src="avatar-vetra-1024.png" alt="Знак Ветры — стриж в синем круге, 1024 на 1024 пикселя" width="1024" height="1024">
    <figcaption>PNG · 1024 × 1024 · 36 КБ</figcaption>
  </figure>

  <a class="btn" href="avatar-vetra-1024.png" download="avatar-vetra-1024.png">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12"/><path d="m6.5 10.5 5.5 5.5 5.5-5.5"/><path d="M4 20h16"/>
    </svg>
    Скачать картинку
  </a>

  <p class="hint">Если кнопка открыла картинку вместо скачивания — <a href="avatar-vetra-1024.png">открой её</a>, зажми палец и выбери «Сохранить».</p>
</main>
</body>
</html>
