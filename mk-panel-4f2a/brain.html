const COLORS = ["#c9f24d","#4dd2f2","#f2814d","#b78cf2","#f24d8b","#7ef29a","#f2d24d","#8f897c"];
const groups = [...new Set(DATA.nodes.map(n => n.group))];
const color = g => COLORS[groups.indexOf(g) % COLORS.length];

document.getElementById("stat").textContent =
  DATA.nodes.length + " заметок · " + DATA.edges.length + " связей";
document.getElementById("legend").innerHTML = groups
  .map(g => '<span><b style="background:' + color(g) + '"></b>' + g + "</span>").join("");

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W, H;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener("resize", resize); resize();

// узлы раскидываем по кругу своей группы — так стартовая картина уже читаемая
const N = DATA.nodes.map((n, i) => {
  const gi = groups.indexOf(n.group), a = (i / DATA.nodes.length) * Math.PI * 2;
  return Object.assign({}, n, {
    x: W/2 + Math.cos(a) * (160 + gi * 55) + (Math.random()-.5)*40,
    y: H/2 + Math.sin(a) * (160 + gi * 55) + (Math.random()-.5)*40,
    vx: 0, vy: 0,
    r: 4 + Math.min(10, n.links * 1.1)
  });
});
const byId = Object.fromEntries(N.map(n => [n.id, n]));
const E = DATA.edges.map(e => ({ s: byId[e.s], t: byId[e.t] })).filter(e => e.s && e.t);

let view = { x: 0, y: 0, k: 1 }, drag = null, sel = null, query = "";

function step() {

  for (let i = 0; i < N.length; i++) {
    for (let j = i + 1; j < N.length; j++) {
      const a = N[i], b = N[j];
      let dx = b.x - a.x, dy = b.y - a.y, d2 = dx*dx + dy*dy;
      if (d2 > 90000 || d2 < 0.01) continue;
      const d = Math.sqrt(d2), f = 900 / d2;
      const ux = dx/d*f, uy = dy/d*f;
      a.vx -= ux; a.vy -= uy; b.vx += ux; b.vy += uy;
    }

  for (const e of E) {                      // связи стягивают

    e.s.vx += ux; e.s.vy += uy; e.t.vx -= ux; e.t.vy -= uy;

  for (const n of N) {                      // лёгкое притяжение к центру + трение
    n.vx += (W/2 - n.x) * 0.0006;
    n.vy += (H/2 - n.y) * 0.0006;
    n.vx *= 0.86; n.vy *= 0.86;
    n.x += n.vx; n.y += n.vy;
  }

function draw() {
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.translate(view.x, view.y); ctx.scale(view.k, view.k);

  ctx.lineWidth = 1;
  for (const e of E) {

      ctx.font = "11px -apple-system,Segoe UI,sans-serif";
      ctx.fillText(n.id.slice(0, 26), n.x + n.r + 4, n.y + 3);
    }
    ctx.globalAlpha = 1;
  }
}

(function loop() { step(); draw(); requestAnimationFrame(loop); })();

function at(mx, my) {
  const x = (mx - view.x) / view.k, y = (my - view.y) / view.k;
  return N.find(n => Math.hypot(n.x - x, n.y - y) < n.r + 5);
}

function show(n) {
  sel = n;
  const card = document.getElementById("card");
  const near = E.filter(e => e.s === n || e.t === n).map(e => (e.s === n ? e.t : e.s).id);
  card.style.display = "block";
  card.innerHTML = '<div class="g">' + n.group + "</div><h2>" + n.id + "</h2>" +
    (n.desc ? "<p>" + n.desc + "</p>" : "") +
    "<div class=\"g\">связей: " + near.length + "</div><ul>" +
    (near.map(t => "<li data-t=\"" + t + "\">" + t + "</li>").join("") || "<li>—</li>") + "</ul>";
  card.querySelectorAll("li[data-t]").forEach(li =>
    li.onclick = () => { const t = byId[li.dataset.t]; if (t) { show(t); center(t); } });
}

function center(n) {
  view.x = W/2 - n.x * view.k;
  view.y = H/2 - n.y * view.k;
}

cv.addEventListener("mousedown", e => {
  const n = at(e.clientX, e.clientY);
  if (n) { show(n); drag = { node: n }; }
  else { drag = { pan: true, x: e.clientX - view.x, y: e.clientY - view.y };
         sel = null; document.getElementById("card").style.display = "none"; }
});
addEventListener("mousemove", e => {
  if (!drag) return;
  if (drag.pan) { view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; }
  else { drag.node.x = (e.clientX - view.x) / view.k; drag.node.y = (e.clientY - view.y) / view.k;
         drag.node.vx = drag.node.vy = 0; }
});
addEventListener("mouseup", () => drag = null);
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const k = view.k * (e.deltaY < 0 ? 1.12 : 0.89);
  view.k = Math.max(0.25, Math.min(4, k));
}, { passive: false });

document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  if (query) {
    const hit = N.find(n => n.id.toLowerCase().includes(query));
    if (hit) { show(hit); center(hit); }
  }
});
</script>
</body>
