<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Проба картинок упражнений</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;color:#fff;font-family:'Golos Text',system-ui,sans-serif;padding:22px 16px 60px}
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
  .lead{color:#7c7c7c;font-size:14px;margin-top:8px;line-height:1.5}
  figure{margin-top:22px;background:#0e0e0e;border:1px solid #2a2a2a;border-radius:22px;overflow:hidden}
  img{width:100%;display:block}
  figcaption{padding:12px 15px 14px}
  b{display:block;font-size:16px;font-weight:700}
  small{display:block;color:#7c7c7c;font-size:12.5px;margin-top:3px}
  em{color:#b8ff2e;font-style:normal;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>Проба: картинки упражнений</h1>
  <p class="lead">Три штуки на пробу, генерация. Серая фигура на чёрном, работающие мышцы горят —
  по твоим референсам. Если стиль подходит, догоню остальные упражнения по этому же шаблону.</p>

  <figure>
    <img src="pullup.png" alt="Подтягивания">
    <figcaption><b>Подтягивания</b><small>горят <em>широчайшие</em> и бицепс, вид со спины</small></figcaption>
  </figure>

  <figure>
    <img src="bench.png" alt="Жим гантелей лёжа">
    <figcaption><b>Жим гантелей лёжа</b><small>горит <em>грудь</em>, вид сбоку</small></figcaption>
  </figure>

  <figure>
    <img src="squat.png" alt="Приседания">
    <figcaption><b>Приседания</b><small>горят <em>квадрицепсы и ягодицы</em>, нижняя точка</small></figcaption>
  </figure>
</div>
</body>
</html>
