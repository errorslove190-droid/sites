<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Проба картинок упражнений</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;color:#fff;font-family:'Golos Text',system-ui,sans-serif;padding:22px 16px 60px}
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
  .lead{color:#7c7c7c;font-size:14px;margin-top:8px;line-height:1.5}
  figure{margin-top:22px;background:#0e0e0e;border:1px solid #2a2a2a;border-radius:22px;overflow:hidden}
  img{width:100%;display:block}
  figcaption{padding:12px 15px 14px}
  b{display:block;font-size:16px;font-weight:700}
  small{display:block;color:#7c7c7c;font-size:12.5px;margin-top:3px}
  em{color:#b8ff2e;font-style:normal;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>Упражнения: 23 картинок</h1>
  <p class="lead">Серая фигура на чёрном, работающие мышцы горят — по референсам от 21.08.
  Эти же картинки открываются в приложении, когда тапаешь мышцу и выбираешь упражнение.</p>

  <figure>
    <img src="sh-press.png" alt="Жим гантелей сидя" loading="lazy">
    <figcaption><b>Жим гантелей сидя</b><small>работают: <em>плечи, трицепс</em></small></figcaption>
  </figure>
  <figure>
    <img src="sh-lat.png" alt="Отведения в стороны" loading="lazy">
    <figcaption><b>Отведения в стороны</b><small>работают: <em>плечи</em></small></figcaption>
  </figure>
  <figure>
    <img src="sh-front.png" alt="Подъём перед собой" loading="lazy">
    <figcaption><b>Подъём перед собой</b><small>работают: <em>плечи</em></small></figcaption>
  </figure>
  <figure>
    <img src="ch-press.png" alt="Жим гантелей лёжа" loading="lazy">
    <figcaption><b>Жим гантелей лёжа</b><small>работают: <em>грудь, трицепс, плечи</em></small></figcaption>
  </figure>
  <figure>
    <img src="ch-incline.png" alt="Жим на наклонной" loading="lazy">
    <figcaption><b>Жим на наклонной</b><small>работают: <em>грудь, плечи, трицепс</em></small></figcaption>
  </figure>
  <figure>
    <img src="ch-dip.png" alt="Брусья" loading="lazy">
    <figcaption><b>Брусья</b><small>работают: <em>грудь, трицепс, плечи</em></small></figcaption>
  </figure>
  <figure>
    <img src="ch-push.png" alt="Отжимания" loading="lazy">
    <figcaption><b>Отжимания</b><small>работают: <em>грудь, трицепс, пресс</em></small></figcaption>
  </figure>
  <figure>
    <img src="bk-pullup.png" alt="Подтягивания" loading="lazy">
    <figcaption><b>Подтягивания</b><small>работают: <em>спина, бицепс</em></small></figcaption>
  </figure>
  <figure>
    <img src="bk-lat.png" alt="Тяга верхнего блока" loading="lazy">
    <figcaption><b>Тяга верхнего блока</b><small>работают: <em>спина, бицепс</em></small></figcaption>
  </figure>
  <figure>
    <img src="bk-row.png" alt="Тяга гантели в наклоне" loading="lazy">
    <figcaption><b>Тяга гантели в наклоне</b><small>работают: <em>спина, бицепс</em></small></figcaption>
  </figure>
  <figure>
    <img src="bk-hyper.png" alt="Гиперэкстензия" loading="lazy">
    <figcaption><b>Гиперэкстензия</b><small>работают: <em>спина</em></small></figcaption>
  </figure>
  <figure>
    <img src="bi-curl.png" alt="Подъём на бицепс" loading="lazy">
    <figcaption><b>Подъём на бицепс</b><small>работают: <em>бицепс</em></small></figcaption>
  </figure>
  <figure>
    <img src="bi-hammer.png" alt="Молотки" loading="lazy">
    <figcaption><b>Молотки</b><small>работают: <em>бицепс</em></small></figcaption>
  </figure>
  <figure>
    <img src="tr-push.png" alt="Разгибания на блоке" loading="lazy">
    <figcaption><b>Разгибания на блоке</b><small>работают: <em>трицепс</em></small></figcaption>
  </figure>
  <figure>
    <img src="tr-french.png" alt="Французский жим" loading="lazy">
    <figcaption><b>Французский жим</b><small>работают: <em>трицепс</em></small></figcaption>
  </figure>
  <figure>
    <img src="ab-plank.png" alt="Планка" loading="lazy">
    <figcaption><b>Планка</b><small>работают: <em>пресс</em></small></figcaption>
  </figure>
  <figure>
    <img src="ab-crunch.png" alt="Скручивания" loading="lazy">
    <figcaption><b>Скручивания</b><small>работают: <em>пресс</em></small></figcaption>
  </figure>
  <figure>
    <img src="ab-legs.png" alt="Подъём ног в висе" loading="lazy">
    <figcaption><b>Подъём ног в висе</b><small>работают: <em>пресс</em></small></figcaption>
  </figure>
  <figure>
    <img src="lg-squat.png" alt="Приседания" loading="lazy">
    <figcaption><b>Приседания</b><small>работают: <em>ноги</em></small></figcaption>
  </figure>
  <figure>
    <img src="lg-press.png" alt="Жим ногами" loading="lazy">
    <figcaption><b>Жим ногами</b><small>работают: <em>ноги</em></small></figcaption>
  </figure>
  <figure>
    <img src="lg-lunge.png" alt="Выпады" loading="lazy">
    <figcaption><b>Выпады</b><small>работают: <em>ноги</em></small></figcaption>
  </figure>
  <figure>
    <img src="lg-rdl.png" alt="Румынская тяга" loading="lazy">
    <figcaption><b>Румынская тяга</b><small>работают: <em>ноги, спина</em></small></figcaption>
  </figure>
  <figure>
    <img src="cf-raise.png" alt="Подъёмы на носки" loading="lazy">
    <figcaption><b>Подъёмы на носки</b><small>работают: <em>икры</em></small></figcaption>
  </figure>
</div>
</body>
</html>
